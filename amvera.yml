# Конфигурация Amvera. По умолчанию один проект, в котором работают все три
# процесса: bot, web и collector (APP_ROLE=all). Разнести их по отдельным
# проектам можно, задав в каждом свою APP_ROLE — файл для всех один.
meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # Порт слушает веб-админка (она же отвечает на /healthz)
  containerPort: 80
  # Постоянное хранилище: сессия Telegram, скачанные голосовые, кэш моделей
  persistenceMount: /data
