[project]
name = "tg-digest"
version = "0.1.0"
description = "Telegram digest & Q&A bot for a private group (collector + bot + web admin)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "telethon>=1.36",
    "aiogram>=3.7",
    "telegraph>=2.2",
    "openai>=1.40",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
media = ["faster-whisper>=1.0"]
embed = ["sentence-transformers>=3.0"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1", "itsdangerous>=2.2"]
ml = ["scikit-learn>=1.5", "numpy>=1.26"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — это норма

[tool.ruff.lint.per-file-ignores]
# В тестах блокирующая работа с файлами безвредна: там нет живого цикла событий,
# который кто-то ждёт. В src это правило остаётся включённым.
"tests/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]
# handlers_copier.py — готовый файл из ТЗ §4.6, он ссылается на repo.mark_copied и
# answer_about_thread, которых ещё нет. Снять исключение на шаге 9, когда они появятся.
exclude = ["src/bot/handlers_copier.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
