<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админка{% endblock %} · tg-digest</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block head %}{% endblock %}
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --muted: #6b7280;
      --line: #e5e7eb; --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161b; --card: #1a1f26; --ink: #e8eaed; --muted: #9aa4b2;
        --line: #2b323b; --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      background: var(--card); border-bottom: 1px solid var(--line);
      padding: 12px 16px; position: sticky; top: 0; z-index: 10;
    }
    nav { display: flex; flex-wrap: wrap; gap: 4px; max-width: 1100px; margin: 0 auto; }
    nav a {
      color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px;
      white-space: nowrap;
    }
    nav a:hover { background: var(--bg); color: var(--ink); }
    nav a.on { background: var(--accent); color: #fff; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 4px 0 16px; }
    h2 { font-size: 17px; margin: 24px 0 10px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px; margin-bottom: 12px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .row > .card { flex: 1 1 220px; }
    .muted { color: var(--muted); font-size: 13px; }
    .big { font-size: 26px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    button, .btn {
      background: var(--accent); color: #fff; border: 0; border-radius: 6px;
      padding: 6px 12px; cursor: pointer; font-size: 14px; text-decoration: none;
      display: inline-block;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    button.bad { background: var(--bad); }
    input[type=text], input[type=number], textarea, select {
      width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--bg); color: var(--ink); font: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px;
      border: 1px solid var(--line);
    }
    .pill.on { background: var(--ok); color: #fff; border-color: transparent; }
    .pill.off { color: var(--muted); }
    .pill.warn { background: var(--warn); color: #fff; border-color: transparent; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .topic { border-left: 3px solid var(--line); padding-left: 10px; margin: 10px 0; }
    .topic.shown { border-left-color: var(--ok); }
    .topic.missed { border-left-color: var(--muted); }
  </style>
</head>
<body>
<header>
  <nav>
    {% set page = active|default('') %}
    <a href="/" class="{{ 'on' if page == 'dashboard' }}">Дашборд</a>
    <a href="/groups" class="{{ 'on' if page == 'groups' }}">Группы</a>
    <a href="/selection" class="{{ 'on' if page == 'selection' }}">Отбор</a>
    <a href="/digests" class="{{ 'on' if page == 'digests' }}">Дайджесты</a>
    <a href="/learning" class="{{ 'on' if page == 'learning' }}">Обучение</a>
    <a href="/authors" class="{{ 'on' if page == 'authors' }}">Участники</a>
    <a href="/ratings" class="{{ 'on' if page == 'ratings' }}">Рейтинги</a>
    <a href="/qa" class="{{ 'on' if page == 'qa' }}">Q&amp;A</a>
    <a href="/system" class="{{ 'on' if page == 'system' }}">Система</a>
    <a href="/logout" style="margin-left:auto">Выйти</a>
  </nav>
</header>
<main>
  <h1>{% block h1 %}{% endblock %}</h1>
  {% block content %}{% endblock %}
</main>
</body>
</html>
